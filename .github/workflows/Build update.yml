name: Build Full System Repair Package (Auto Links)

on:
  workflow_dispatch:

jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: System-Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full util-linux parted xz-utils rsync

      - name: Release-Teile automatisch herunterladen
        run: |
          echo "Lade Teil 1 herunter..."
          wget -O release.7z.001 "https://github.com/lcdyk0517/arkos4clone/releases/download/20260625/dArkOS4Clone-06252026.img.xz.7z.001"
          echo "Lade Teil 2 herunter..."
          wget -O release.7z.002 "https://github.com/lcdyk0517/arkos4clone/releases/download/20260625/dArkOS4Clone-06252026.img.xz.7z.002"
          echo "Lade Teil 3 herunter..."
          wget -O release.7z.003 "https://github.com/lcdyk0517/arkos4clone/releases/download/20260625/dArkOS4Clone-06252026.img.xz.7z.003"

      - name: Archive zusammenfügen & entpacken
        run: |
          echo "Entpacke .7z Archive..."
          7z x release.7z.001 -oextracted_img
          
          # XZ-komprimiertes Image entpacken (.img.xz -> .img)
          XZ_FILE=$(find extracted_img -name "*.img.xz" | head -n 1)
          if [ -n "$XZ_FILE" ]; then
            unxz "$XZ_FILE"
          else
            XZ_FILE2=$(find extracted_img -name "*.xz" | head -n 1)
            [ -n "$XZ_FILE2" ] && unxz "$XZ_FILE2"
          fi

      - name: System mounten und exklusive ROMs extrahieren
        run: |
          IMG_FILE=$(find extracted_img -name "*.img" | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            echo "FEHLER: Keine .img Datei gefunden!"
            exit 1
          fi
          
          LOOP_DEV=$(sudo losetup --find --show -P "$IMG_FILE")
          mkdir -p mnt_root final_package
          
          # Linux Root-Partition mounten
          sudo mount "${LOOP_DEV}p2" mnt_root || sudo mount "${LOOP_DEV}p3" mnt_root
          
          echo "Kopiere Systemdateien (ohne ROMs)..."
          sudo rsync -a \
            --exclude='/roms' \
            --exclude='/media' \
            --exclude='/lost+found' \
            --exclude='/proc' \
            --exclude='/sys' \
            --exclude='/dev' \
            --exclude='/run' \
            --exclude='/mnt' \
            mnt_root/ final_package/
          
          sudo umount mnt_root
          sudo losetup -d "$LOOP_DEV"

      - name: update.tar und firstboot.sh generieren
        run: |
          # Dateiberechtigungen von root auf den normalen User übertragen
          sudo chown -R $USER:$USER final_package/

          # 1. update.tar aus den Systemdateien erstellen
          cd final_package
          echo "Packe update.tar..."
          tar -cvf ../update.tar .
          cd ..
          
          # Ordner für das finale Artefakt vorbereiten
          mkdir -p artifact_out
          mv update.tar artifact_out/
          
          # 2. Automatische firstboot.sh erstellen
          echo "Erstelle firstboot.sh..."
          cat << 'EOF' > artifact_out/firstboot.sh
          #!/bin/bash
          # =========================================================
          # Automatische System-Reparatur für ArkOS4Clones
          # =========================================================

          echo "=== System-Wiederherstellung gestartet ==="

          ROM_DIR=""
          for dir in /roms /media/fat /storage; do
              if [ -f "$dir/update.tar" ]; then
                  ROM_DIR="$dir"
                  break
              fi
          done

          if [ -z "$ROM_DIR" ]; then
              for dir in /roms /media/fat /storage; do
                  if [ -d "$dir" ]; then
                      ROM_DIR="$dir"
                      break
                  fi
              done
          fi

          UPDATE_ARCHIVE="$ROM_DIR/update.tar"

          if [ -f "$UPDATE_ARCHIVE" ]; then
              echo "[INFO] update.tar auf ROMs-Partition gefunden. Spiele System-Dateien auf..."
              tar -xvf "$UPDATE_ARCHIVE" -C /
              
              echo "[INFO] Lösche update.tar nach erfolgreichem Update..."
              rm -f "$UPDATE_ARCHIVE"
              echo "[INFO] System-Wiederherstellung erfolgreich abgeschlossen!"
          else
              echo "[FEHLER] update.tar wurde nicht gefunden!"
          fi

          rm -f /boot/firstboot.sh 2>/dev/null
          rm -f /firstboot.sh 2>/dev/null

          sync
          echo "=== Neustart wird eingeleitet ==="
          EOF
          
          chmod +x artifact_out/firstboot.sh
          ls -lh artifact_out/

      - name: Paket als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: xu10-complete-repair-package
          path: artifact_out/
